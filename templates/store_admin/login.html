{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | LuxeDrape Haute Drapery</title>
  
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/curtains.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --obsidian: #080d1a;
      --navy-dark: #0b1329;
      --navy-slate: #162038;
      --gold: #c5a880;
      --gold-metallic: #d4af37;
      --gold-gradient: linear-gradient(135deg, #dfba43 0%, #c5a880 50%, #9e7d47 100%);
      --gold-light: #f5eedc;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-modern: 'Outfit', sans-serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
                  linear-gradient(135deg, #080d1a 0%, #0b1329 50%, #162038 100%);
      font-family: var(--font-sans);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .admin-login-card {
      background: rgba(11, 19, 41, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 28px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), 0 0 35px rgba(212, 175, 55, 0.15);
      position: relative;
      overflow: hidden;
    }

    .admin-login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gold-gradient);
    }

    .brand-logo-title {
      font-family: 'Cinzel', var(--font-serif);
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
    }

    .brand-logo-title .gold {
      color: var(--gold-metallic);
    }

    .form-control-admin {
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .form-control-admin:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--gold-metallic);
      color: #ffffff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
    }

    .form-control-admin::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .btn-admin-submit {
      background: var(--gold-gradient);
      color: #080d1a;
      font-family: var(--font-modern);
      font-weight: 700;
      font-size: 1rem;
      padding: 14px;
      border-radius: 12px;
      border: none;
      width: 100%;
      letter-spacing: 0.03em;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
    }

    .btn-admin-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
      color: #080d1a;
    }

    .demo-creds-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(212, 175, 55, 0.3);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 rounded-circle mb-3" style="width: 60px; height: 60px; border: 1px solid rgba(212, 175, 55, 0.3);">
        <i class="fas fa-crown text-warning fs-3"></i>
      </div>
      <div class="brand-logo-title">
        LUXE<span class="gold">ADMIN</span>
      </div>
      <div class="text-warning small text-uppercase fw-bold font-modern mt-1" style="letter-spacing: 0.15em; font-size: 0.75rem;">
        Haute Drapery Management Portal
      </div>
    </div>

    <!-- Django Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show small py-2 px-3 rounded-3" role="alert">
          {{ message }}
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'store_admin:login' %}">
      {% csrf_token %}
      {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
      {% endif %}

      <div class="mb-3">
        <label class="form-label small text-light fw-semibold">Administrator Username</label>
        <div class="input-group">
          <input type="text" name="username" id="adminUsername" class="form-control form-control-admin" placeholder="Enter admin username" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label small text-light fw-semibold mb-0">Password</label>
        </div>
        <div class="input-group">
          <input type="password" name="password" id="adminPassword" class="form-control form-control-admin" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-admin-submit mb-4">
        <i class="fas fa-lock-open me-2"></i> Access Management Portal
      </button>
    </form>

    <div class="text-center">
      <a href="{% url 'core:home' %}" class="text-light opacity-60 text-decoration-none small">
        <i class="fas fa-arrow-left me-1"></i> Return to LuxeDrape Storefront
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
